<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vich Chinh ⚔️ Quo Li</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:white;font-family:Arial,sans-serif;touch-action:none}body{display:grid;place-items:center}#app{position:relative;width:100vw;height:100vh;display:grid;place-items:center}canvas{width:min(100vw,1280px);height:auto;max-height:100vh;background:#12213a}.screen{position:absolute;inset:0;display:grid;place-items:center;background:#0006;z-index:10}.panel{width:min(92vw,650px);padding:28px;text-align:center;background:#0b1529f5;border:1px solid #ffffff22;border-radius:22px;box-shadow:0 20px 70px #000b}.title{font-size:clamp(36px,7vw,70px);font-weight:900;margin:0 0 12px}.sub{color:#b9c4d9}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.card{padding:14px;background:#ffffff09;border:1px solid #ffffff12;border-radius:15px}.card p{color:#b9c4d9;font-size:14px}button{border:0;border-radius:13px;padding:13px 20px;font-weight:900;font-size:16px;cursor:pointer}.primary{background:white;color:#08111f}.secondary{background:#ffffff14;color:white}.hide{display:none!important}#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(96vw,1200px);display:flex;gap:10px;z-index:5;pointer-events:none}.box{flex:1;background:#07101deb;border:1px solid #ffffff15;border-radius:13px;padding:8px}.head{display:flex;justify-content:space-between;font-weight:900;font-size:13px}.bar{height:9px;background:#ffffff12;border-radius:20px;margin-top:6px;overflow:hidden}.fill{height:100%;width:100%}.b1{background:#36a7ff}.b2{background:#ff526e}#timer{min-width:78px;text-align:center;padding:9px;background:#07101deb;border-radius:13px;font-weight:900;font-size:19px}.topbtn{position:absolute;top:10px;z-index:6;padding:8px 11px;font-size:12px}.leftbtn{left:10px}.rightbtn{right:10px}.touch{position:absolute;inset:0;z-index:7;pointer-events:none}.tg{position:absolute;bottom:12px;display:flex;gap:14px;align-items:end;pointer-events:auto}.tg1{left:10px}.tg2{right:10px;flex-direction:row-reverse}.pad{width:140px;height:140px;position:relative}.t{position:absolute;width:48px;height:48px;border-radius:13px;background:#172746e8;border:1px solid #ffffff25;display:grid;place-items:center;font-size:18px;font-weight:900;user-select:none;touch-action:none}.t:active{filter:brightness(1.4)}.up{left:46px;top:0}.down{left:46px;bottom:0}.left{left:0;top:46px}.right{right:0;top:46px}.shoot{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#1768e8}.red{background:#d72b4f}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{padding:12px;text-align:left;background:#ffffff09;border-radius:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.tg{transform:scale(.75);transform-origin:bottom left}.tg2{transform-origin:bottom right}.panel{padding:20px}}@media(max-width:430px){.tg{transform:scale(.62)}.head{font-size:10px}.box{padding:6px}.bar{height:7px}#timer{min-width:60px;font-size:15px}}</style></head><body><div id="app"><canvas id="game" width="1280" height="720"></canvas><div id="hud" class="hide"><div class="box"><div class="head"><span>🔵 VICH CHINH</span><span id="hp1">100 HP</span></div><div class="bar"><div id="bar1" class="fill b1"></div></div></div><div id="timer">02:00</div><div class="box"><div class="head"><span>🔴 QUO LI</span><span id="hp2">100 HP</span></div><div class="bar"><div id="bar2" class="fill b2"></div></div></div></div><button id="sound" class="topbtn leftbtn secondary hide">🔊 Sound</button><button id="pause" class="topbtn rightbtn secondary hide">⏸ Pause</button><div id="touch" class="touch hide"><div class="tg tg1"><div class="pad"><div class="t up" data-p="1" data-a="u">▲</div><div class="t left" data-p="1" data-a="l">◀</div><div class="t right" data-p="1" data-a="r">▶</div><div class="t down" data-p="1" data-a="d">▼</div></div><div class="t shoot" data-p="1" data-a="s">SHOOT</div></div><div class="tg tg2"><div class="pad"><div class="t up" data-p="2" data-a="u">▲</div><div class="t left" data-p="2" data-a="l">◀</div><div class="t right" data-p="2" data-a="r">▶</div><div class="t down" data-p="2" data-a="d">▼</div></div><div class="t shoot red" data-p="2" data-a="s">SHOOT</div></div></div><div id="startScreen" class="screen"><div class="panel"><h1 class="title">VICH CHINH ⚔️ QUO LI</h1><p class="sub">2 Players. 100 HP. One Winner.</p><div class="cards"><div class="card"><b>🔵 Vich Chinh</b><p>W A S D = move<br>F = shoot</p></div><div class="card"><b>🔴 Quo Li</b><p>Arrow Keys = move<br>Enter = shoot</p></div></div><div class="card"><b>📱 Mobile</b><p>Both players can use the touch controls at the same time.</p></div><br><button id="start" class="primary">START GAME</button></div></div><div id="pauseScreen" class="screen hide"><div class="panel"><h1 class="title">PAUSED</h1><button id="resume" class="primary">RESUME</button></div></div><div id="endScreen" class="screen hide"><div class="panel"><h1 id="winner" class="title">🏆 WIN!</h1><p id="result" class="sub"></p><div id="stats" class="stats"></div><button id="again" class="primary">PLAY AGAIN</button> <button id="menu" class="secondary">MAIN MENU</button></div></div></div><script>(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=1280,H=720,keys=new Set(),bullets=[],touch={1:{u:0,d:0,l:0,r:0,s:0},2:{u:0,d:0,l:0,r:0,s:0}},ptr=new Map();let state='menu',time=120,soundOn=true,audio=null,shake=0;const O=[{x:90,y:120,w:200,h:45},{x:990,y:120,w:200,h:45},{x:90,y:555,w:200,h:45},{x:990,y:555,w:200,h:45},{x:530,y:90,w:220,h:50},{x:530,y:580,w:220,h:50},{x:300,y:240,w:130,h:90},{x:850,y:240,w:130,h:90},{x:300,y:390,w:130,h:90},{x:850,y:390,w:130,h:90},{x:575,y:275,w:130,h:170},{x:55,y:300,w:55,h:120},{x:1170,y:300,w:55,h:120}];class Player{constructor(name,color,x,y,dir,n){this.name=name;this.color=color;this.spawn={x,y,dir};this.n=n;this.r=23;this.speed=285;this.reset()}reset(){this.x=this.spawn.x;this.y=this.spawn.y;this.dir=this.spawn.dir;this.hp=100;this.cd=0;this.flash=0;this.shots=0;this.hits=0}input(){let dx=0,dy=0,t=touch[this.n];if(this.n===1){if(keys.has('KeyW')||t.u)dy--;if(keys.has('KeyS')||t.d)dy++;if(keys.has('KeyA')||t.l)dx--;if(keys.has('KeyD')||t.r)dx++}else{if(keys.has('ArrowUp')||t.u)dy--;if(keys.has('ArrowDown')||t.d)dy++;if(keys.has('ArrowLeft')||t.l)dx--;if(keys.has('ArrowRight')||t.r)dx++}if(dx||dy){let n=Math.hypot(dx,dy);dx/=n;dy/=n;if(Math.abs(dx)>=Math.abs(dy))this.dir=dx>0?'r':'l';else this.dir=dy>0?'d':'u'}return[dx,dy]}shooting(){return this.n===1?(keys.has('KeyF')||touch[1].s):(keys.has('Enter')||touch[2].s)}update(dt){this.cd=Math.max(0,this.cd-dt);this.flash=Math.max(0,this.flash-dt);let[dx,dy]=this.input();move(this,dx,dy,dt);if(this.shooting()&&this.cd<=0)fire(this)}draw(){x.save();x.translate(this.x,this.y);if(this.flash>0&&Math.floor(this.flash*30)%2===0)x.globalAlpha=.45;x.fillStyle=this.color;x.beginPath();x.arc(0,0,23,0,7);x.fill();x.strokeStyle='#fff9';x.lineWidth=4;x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(-7,-5,5,0,7);x.arc(7,-5,5,0,7);x.fill();let d={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[this.dir];x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();x.moveTo(d[0]*14,d[1]*14);x.lineTo(d[0]*30,d[1]*30);x.stroke();x.restore();x.fillStyle='#0008';x.fillRect(this.x-30,this.y-42,60,7);x.fillStyle=this.color;x.fillRect(this.x-30,this.y-42,60*this.hp/100,7);x.font='bold 12px Arial';x.textAlign='center';x.fillStyle='#fff';x.fillText(this.name,this.x,this.y-48)}}const p1=new Player('VICH CHINH','#35a8ff',145,360,'r',1),p2=new Player('QUO LI','#ff526e',1135,360,'l',2);function cr(cx,cy,r,o){let nx=Math.max(o.x,Math.min(cx,o.x+o.w)),ny=Math.max(o.y,Math.min(cy,o.y+o.h)),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r}function can(p,nx,ny){if(nx-p.r<5||nx+p.r>W-5||ny-p.r<5||ny+p.r>H-5)return false;return !O.some(o=>cr(nx,ny,p.r,o))}function move(p,dx,dy,dt){let nx=p.x+dx*p.speed*dt,ny=p.y+dy*p.speed*dt;if(can(p,nx,ny)){p.x=nx;p.y=ny}else{if(can(p,nx,p.y))p.x=nx;if(can(p,p.x,ny))p.y=ny}}function blocked(b){return O.some(o=>cr(b.x,b.y,b.r,o))}function fire(p){p.cd=.3;p.shots++;let d={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[p.dir];bullets.push({x:p.x+d[0]*36,y:p.y+d[1]*36,dx:d[0],dy:d[1],owner:p,life:1.7,r:6});beep(250,.05,'square',.02)}function hit(p){p.hp=Math.max(0,p.hp-10);p.hits++;p.flash=.22;shake=7;beep(120,.1,'sawtooth',.03);updateHud();if(p.hp<=0)finish(p===p1?p2:p1)}function drawArena(){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1b2c4b');g.addColorStop(1,'#0b1729');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.08;x.strokeStyle='#bcd1ff';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.globalAlpha=1;for(const o of O){x.fillStyle='#435572';x.strokeStyle='#fff2';x.beginPath();x.roundRect(o.x,o.y,o.w,o.h,10);x.fill();x.stroke()}}function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],gone=false;for(let s=0;s<4;s++){b.x+=b.dx*720*dt/4;b.y+=b.dy*720*dt/4;if(b.x<0||b.x>W||b.y<0||b.y>H||blocked(b)){gone=true;break}let t=b.owner===p1?p2:p1;if(Math.hypot(b.x-t.x,b.y-t.y)<b.r+t.r){hit(t);gone=true;break}}b.life-=dt;if(b.life<=0)gone=true;if(gone)bullets.splice(i,1)}}function draw(){x.clearRect(0,0,W,H);x.save();if(shake>0)x.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);drawArena();for(const b of bullets){x.fillStyle=b.owner.color;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}p1.draw();p2.draw();x.restore()}function updateHud(){let s=Math.max(0,Math.ceil(time));$('hp1').textContent=p1.hp+' HP';$('hp2').textContent=p2.hp+' HP';$('bar1').style.width=p1.hp+'%';$('bar2').style.width=p2.hp+'%';$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function ui(on){['hud','sound','pause'].forEach(id=>$(id).classList.toggle('hide',!on));$('touch').classList.toggle('hide',!(on&&(navigator.maxTouchPoints>0||'ontouchstart'in window)))}function startGame(){p1.reset();p2.reset();bullets.length=0;time=120;state='play';shake=0;$('startScreen').classList.add('hide');$('endScreen').classList.add('hide');$('pauseScreen').classList.add('hide');ui(true);updateHud();beep(330,.08,'triangle',.02)}function finish(w){state='end';ui(false);$('winner').textContent='🏆 '+w.name+' WINS!';$('result').textContent='10 successful hits = 100 HP.';$('stats').innerHTML='<div class="stat">🔵 Vich Chinh<br>Shots: '+p1.shots+'<br>Hits: '+p1.hits+'</div><div class="stat">🔴 Quo Li<br>Shots: '+p2.shots+'<br>Hits: '+p2.hits+'</div>';$('endScreen').classList.remove('hide');beep(450,.12,'triangle',.04)}function pauseGame(){if(state!=='play')return;state='pause';$('pauseScreen').classList.remove('hide');$('pause').textContent='▶ Resume'}function resume(){if(state!=='pause')return;state='play';$('pauseScreen').classList.add('hide');$('pause').textContent='⏸ Pause'}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();if(e.code==='KeyP'){state==='play'?pauseGame():resume();return}keys.add(e.code)},{passive:false});document.addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-a]').forEach(el=>{const end=e=>{let q=ptr.get(e.pointerId);if(!q)return;touch[q.p][q.a]=0;q.el.classList.remove('active');ptr.delete(e.pointerId)};el.addEventListener('pointerdown',e=>{e.preventDefault();let p=+el.dataset.p,a=el.dataset.a;ptr.set(e.pointerId,{p,a,el});touch[p][a]=1;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)});$('start').addEventListener('click',startGame);$('again').addEventListener('click',startGame);$('resume').addEventListener('click',resume);$('pause').addEventListener('click',()=>state==='pause'?resume():pauseGame());$('menu').addEventListener('click',()=>{state='menu';$('endScreen').classList.add('hide');$('startScreen').classList.remove('hide')});$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound':'🔇 Muted'});function beep(f,d,t,g){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(g,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(_){}}function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;if(state==='play'){p1.update(dt);p2.update(dt);updateBullets(dt);time=Math.max(0,time-dt);updateHud();if(time<=0){if(p1.hp>p2.hp)finish(p1);else if(p2.hp>p1.hp)finish(p2);else{state='end';ui(false);$('winner').textContent='🤝 DRAW!';$('result').textContent='Time ran out.';$('stats').innerHTML='';$('endScreen').classList.remove('hide')}}shake=Math.max(0,shake-dt*30)}draw();requestAnimationFrame(loop)}ui(false);updateHud();requestAnimationFrame(loop)})();</script></body></html>
